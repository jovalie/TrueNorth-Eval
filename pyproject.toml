[project]
name = "truenorth"
version = "0.1.0"
description = "AI agentic workflow with multi-provider LLM support"
authors = []
readme = "README.md"
requires-python = ">=3.11,<3.13"

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[tool.poetry.dependencies]
python = ">=3.11,<3.13"

# --- LangChain Core & Orchestration ---
langchain = "^0.3.0"
langchain-community = "*"
langgraph = "0.2.56"

# --- Model Providers ---
langchain-anthropic = "^0.3.5"
langchain-groq = "^0.2.3"
langchain-google-genai = "^2.0.11"
langchain-google-vertexai = "^2.0.13"
langchain-openai = "^0.3.5"
langchain-deepseek = "^0.1.2"
langchain-ollama = "^0.2.0"
langchain-huggingface = "^0.1.2"

# --- Document Parsing & Utilities ---
langchain-pymupdf4llm = "^0.2.0"
unstructured = "^0.17.2"
pydantic = "^2.11.3"
python-dotenv = "1.0.0"
bibtexparser = "^1.4.0"
jq = "^1.8.0"

# --- Data Science & Vector DB ---
pandas = "^2.1.0"
numpy = "*"
scikit-learn = "^1.6.1"
matplotlib = "^3.9.2"
seaborn = "^0.13.2"
faiss-cpu = "^1.11.0"

# --- Infrastructure & API ---
fastapi = "^0.115.12"
uvicorn = "^0.34.1"
discord-py = "^2.6.4"

# --- Database ---
sqlalchemy = "^2.0.0"
psycopg2-binary = "^2.9.0"
alembic = "^1.13.0"

# --- CLI & Terminal UI ---
tabulate = "^0.9.0"
colorama = "^0.4.6"
questionary = "^2.1.0"
rich = "^13.9.4"

# --- PyTorch ---
torch = { version = "^2.2.0", source = "pytorch-cpu" }

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
black = "^23.7.0"
isort = "^5.12.0"
flake8 = "^6.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py312']
include = '\.pyi?$'